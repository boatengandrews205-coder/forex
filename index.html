<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FX Backtest Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📊 FX Backtest Lab</h1>
    <p class="sub">Built for mentees — Beginner • Intermediate • Advanced</p>
  </header>

  <main>
    <!-- SKILL LEVEL SELECTOR -->
    <section class="card">
      <label for="level">Your Level</label>
      <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </section>

    <!-- MARKET SELECTOR -->
    <section class="card">
      <label for="market">Market</label>
      <select id="market">
        <option>Forex</option>
        <option>Metals</option>
        <option>Commodities</option>
        <option>Indices</option>
        <option>Synthetics</option>
      </select>

      <label for="pair">Instrument</label>
      <select id="pair"></select>
    </section>

    <!-- TRADE ENTRY -->
    <section class="card">
      <h2>Add a Trade</h2>
      <label>Direction</label>
      <select id="direction">
        <option value="buy">Buy (Long)</option>
        <option value="sell">Sell (Short)</option>
      </select>

      <label>Entry Price</label>
      <input type="number" id="entry" placeholder="e.g. 1.0850" step="0.00001" />

      <label>Exit Price</label>
      <input type="number" id="exit" placeholder="e.g. 1.0900" step="0.00001" />

      <label>Lot Size</label>
      <input type="number" id="lots" value="0.10" step="0.01" />

      <button id="addTrade">➕ Add Trade</button>
    </section>

    <!-- RESULTS -->
    <section class="card">
      <h2>📈 Results</h2>
      <div class="stats">
        <div><span id="totalTrades">0</span><small>Trades</small></div>
        <div><span id="winRate">0%</span><small>Win Rate</small></div>
        <div><span id="totalPips">0</span><small>Total Pips</small></div>
        <div><span id="pnl">$0</span><small>P/L</small></div>
      </div>
      <button id="clearAll" class="danger">🗑 Clear All Trades</button>
    </section>

    <!-- TRADE LOG -->
    <section class="card">
      <h2>Trade Log</h2>
      <div id="tradeLog"></div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ for FX mentees</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
